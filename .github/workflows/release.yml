name: Release

# Push a tag like backend-v1.7.0 (it must match "version" in package.json).
# 1. CI must pass.
# 2. A release zip + manifest is built and attached to a DRAFT release in THIS repo.
#    It is not published to the public releases repo: the zip contains the backend code.
on:
  push:
    tags: ['backend-v*']

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#backend-v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG. Bump the version and re-tag."
            exit 1
          fi
          echo "VERSION=$PKG" >> "$GITHUB_ENV"

      - run: npm ci

      - run: npx nest build

      - name: Package release zip
        run: |
          mkdir -p stage out
          cp -r dist package.json package-lock.json stage/
          cp -r database/migrations stage/migrations
          mkdir -p stage/scripts && cp scripts/apply-sql-migration.js stage/scripts/
          ( cd stage && zip -qr "../out/fibe-backend-$VERSION.zip" . )
          SHA=$(sha256sum "out/fibe-backend-$VERSION.zip" | cut -d' ' -f1)
          MIGRATIONS=$(ls database/migrations | sort | node -e 'console.log(JSON.stringify(require("fs").readFileSync(0,"utf8").split("\n").filter(Boolean)))')
          cat > out/release-manifest.json <<JSON
          { "version": "$VERSION", "sha256": "$SHA", "migrations": $MIGRATIONS }
          JSON
          cat out/release-manifest.json

      - name: Create draft release
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --draft --generate-notes --title "Backend $VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
