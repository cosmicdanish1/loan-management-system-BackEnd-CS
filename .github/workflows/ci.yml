name: CI

# Runs on every push and PR, and is also called by release.yml as the gate that
# must pass before a release draft is built.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx nest build

      - name: Unit tests
        # These two suites already fail on main (4 tests). They are excluded here so the
        # gate means something, and re-run below so the failures stay visible.
        run: npm test -- --testPathIgnorePatterns "general-ledger.spec" "member-ledger-columnar.spec"

      - name: Unit tests - known failing (not blocking)
        continue-on-error: true
        run: npm test -- --testPathPattern "general-ledger.spec|member-ledger-columnar.spec"
